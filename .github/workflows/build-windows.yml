name: Build Windows EXE

"on":
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: target

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Build Windows EXE
        if: github.event_name == 'workflow_dispatch'
        run: cargo build --release --manifest-path src-tauri/Cargo.toml --target-dir target

      - name: Verify manual Windows EXE
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "target/release/sayall-windows-app.exe" -PathType Leaf)) {
            throw "未找到 target/release/sayall-windows-app.exe"
          }

      - name: Upload Windows EXE artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: target/release/sayall-windows-app.exe
          if-no-files-found: error

      - name: Build Windows EXE
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: pnpm tauri build --no-bundle

      - name: Verify tag Windows EXE
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "target/release/sayall-windows-app.exe" -PathType Leaf)) {
            throw "未找到 target/release/sayall-windows-app.exe"
          }

      - name: Upload Windows EXE artifacts
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: target/release/sayall-windows-app.exe
          if-no-files-found: error
